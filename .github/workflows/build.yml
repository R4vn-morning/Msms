      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (fast version)
        working-directory: proj
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/*.apk out/R4Vn-release.apk || true
          cp proj/app/build/outputs/apk/debug/*.apk out/R4Vn-debug.apk || true
          ls -la out

      - name: Publish APKs to a branch (direct download, no zip)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls out/*.apk >/dev/null 2>&1; then echo "no apk to publish"; exit 0; fi
          rm -rf pub && mkdir pub && cp out/*.apk pub/
          cd pub
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk-builds
          git add .
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk-builds
          {
            echo "### APK ready (no zip)"
            echo ""
            echo "Install this one: https://github.com/${{ github.repository }}/raw/apk-builds/R4Vn-debug.apk"
            echo ""
            echo "Release: https://github.com/${{ github.repository }}/raw/apk-builds/R4Vn-release.apk"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Direct link: https://github.com/${{ github.repository }}/raw/apk-builds/R4Vn-debug.apk"

      - name: Publish APKs to Releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(ls out/*.apk 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no apk to publish"; exit 0; fi
          gh release create "build-${{ github.run_number }}" $FILES \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "R4Vn Music build ${{ github.run_number }}" \
            --notes "APK files of build ${{ github.run_number }}"
