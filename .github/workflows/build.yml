name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack project
        run: |
          cat > project.b64 <<'EOF_B64'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          GeoOfy7RAsxpGeBdMI+en6NoQwytOSVffYMxLM5jHYerTQ+BbnVL+q1FPI8yynLt8IJiojaZF9v/6Jd+ZNUXxEdv7+F93M0kevxMyz0gyFkaF2ySAAAAAGOIeJfC4wDvAAHK/wOA4BfG7G+XscRn+wIAAAAABFla
          EOF_B64
          mkdir proj
          base64 -d project.b64 | tar xJ -C proj
          find proj -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (fast version)
        working-directory: proj
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/*.apk out/R4Vn-release.apk || true
          cp proj/app/build/outputs/apk/debug/*.apk out/R4Vn-debug.apk || true
          ls -la out

      - name: Publish APKs to a branch (direct download, no zip)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls out/*.apk >/dev/null 2>&1; then echo "no apk to publish"; exit 0; fi
          rm -rf pub && mkdir pub && cp out/*.apk pub/
          cd pub
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk-builds
          echo "# R4Vn Music" > README.md
          echo >> README.md
          echo "Download the latest APK:" >> README.md
          echo >> README.md
          echo "https://github.com/${{ github.repository }}/releases/latest/download/R4Vn-release.apk" >> README.md
          echo >> README.md
          echo "Or open the Releases page: https://github.com/${{ github.repository }}/releases/latest" >> README.md
          git add .
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk-builds
          echo "Direct link: https://github.com/${{ github.repository }}/raw/apk-builds/R4Vn-debug.apk"

      - name: Publish APKs to Releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out/R4Vn-release.apk ]; then echo "no release apk to publish"; exit 0; fi
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest out/R4Vn-release.apk --repo "${{ github.repository }}" --title "R4Vn Music latest build" --notes "Release APK. Build number ${{ github.run_number }}"
